<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VELVET CITY</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0a0e14;font-family:Arial,Helvetica,sans-serif}
#game{display:block;width:100%;height:100%}
#hud{position:absolute;left:12px;top:10px;color:#fff;text-shadow:0 1px 3px #000,0 0 6px #000;font-size:15px;line-height:1.55;pointer-events:none;z-index:5}
#hud b{color:#ffd23f}
#stars{color:#ffd23f;font-size:22px;letter-spacing:3px}
#obj{position:absolute;left:12px;bottom:12px;color:#fff;text-shadow:0 1px 3px #000,0 0 6px #000;font-size:15px;pointer-events:none;z-index:5;max-width:60%}
#minimap{position:absolute;right:12px;top:12px;border:2px solid rgba(255,255,255,.85);background:rgba(8,12,18,.75);z-index:5}
#crosshair{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;pointer-events:none;z-index:6;color:#fff;font-size:22px;text-align:center;line-height:22px;text-shadow:0 0 4px #000}
#ov-title{position:absolute;left:0;right:0;top:30%;text-align:center;color:#fff;z-index:7;pointer-events:none;text-shadow:0 2px 10px #000,0 0 24px #000}
#ov-title .t{font-size:56px;font-weight:bold;letter-spacing:10px;color:#ffd23f}
#ov-title .s{font-size:17px;margin-top:10px;line-height:1.7}
#ov-big{position:absolute;left:0;right:0;top:38%;text-align:center;color:#ff5252;font-size:54px;font-weight:bold;letter-spacing:8px;z-index:7;pointer-events:none;text-shadow:0 2px 10px #000;display:none}
#ov-sub{position:absolute;left:0;right:0;top:52%;text-align:center;color:#fff;font-size:17px;z-index:7;pointer-events:none;text-shadow:0 1px 4px #000;display:none}
#hud-state{display:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div id="hud-money"></div><div id="hud-mission"></div><div id="stars"></div><div id="hud-car"></div><div id="hud-radio"></div></div>
<div id="obj"></div>
<canvas id="minimap" width="180" height="135"></canvas>
<div id="crosshair">+</div>
<div id="ov-title"></div>
<div id="ov-big"></div>
<div id="ov-sub"></div>
<div id="hud-state" data-screen="boot" data-money="0" data-mission="0" data-wanted="0" data-incar="0" data-carhp="100" data-health="100" data-speed="0" data-x="0" data-z="0" data-heading="0" data-dist="0"></div>
<script src="vendor/three.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
